/* ═══════════════════════════════════════════════════════════
   SCORING  — ★ T-11 Fix: cosine similarity (no if/else order bias)
═══════════════════════════════════════════════════════════ */
function cosine(a, b) {
  const dot = a.p*b.p + a.s*b.s + a.a*b.a;
  const ma  = Math.sqrt(a.p**2 + a.s**2 + a.a**2);
  const mb  = Math.sqrt(b.p**2 + b.s**2 + b.a**2);
  return (ma && mb) ? dot / (ma * mb) : 0;
}
function bestResult(scores, sp) {
  if (sp === 'student') return STUDENT;
  return RESULTS.reduce((best, r) => {
    const sim = cosine(scores, r.vector);
    return sim > best.sim ? { r, sim } : best;
  }, { r: RESULTS[RESULTS.length - 1], sim: -1 }).r;
}
 
/* ═══════════════════════════════════════════════════════════
   CLIPBOARD  — ★ T-04 Fix: navigator.clipboard API with execCommand fallback
═══════════════════════════════════════════════════════════ */
async function clip(text) {
  try {
    await navigator.clipboard.writeText(text); return true;
  } catch {
    try {
      const ta = document.createElement('textarea');
      Object.assign(ta.style, { position:'fixed', opacity:'0', top:'0', left:'0' });
      ta.value = text;
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta); return true;
    } catch { return false; }
  }
}
 
function genTicket(res, scores, rt) {
  const id   = Math.floor(1000 + Math.random() * 9000);
  const code = res  ? `${res.code}-P${scores.p}S${scores.s}A${scores.a}`
                    : `REP-${(rt||'XX').toUpperCase()}`;
  const kw   = res  ? res.kw
                    : (rt ? REPAIR_DATA[rt]?.kw : '');
  return { id, code, kw };
}

            <span class="flex items-center gap-1"><${Ic} n="Pin" c="w-3 h-3 text-blue-400" /> 新北新店門市 + 全台宅配</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-lg mx-auto text-left">
            <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-3 text-xs text-slate-300 leading-relaxed">
              ⭐⭐⭐⭐⭐ 「效能硬核玩家 · 阿傑：組完直接玩 4K，一格都沒掉！師傅超專業」
            </div>
            <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-3 text-xs text-slate-300 leading-relaxed">
              ⭐⭐⭐⭐⭐ 「頂級創作者 · Cathy：PR 算圖快了三倍，當初猶豫好久現在超值得」
            </div>
          </div>
        </div>`}
 
      <!-- ════════════════ QUIZ ════════════════ -->
      ${step === 'quiz' && html`
        <${Card}>
          <${Header} icon="Monitor" label="ARCHI PC Core" showHUD=${true} />
          <div class="p-6 md:p-8 min-h-[480px] flex flex-col justify-center fu" key=${node}>
            <div class="flex justify-between items-center mb-6">
              ${hist.length > 0
                ? html`<button onClick=${handleBack} disabled=${selIdx!==null}
                    class="flex items-center text-xs text-slate-400 hover:text-white transition-colors disabled:opacity-40">
                    <${Ic} n="ArrowL" c="w-4 h-4 mr-1" /> 返回上一題
                  </button>`
                : html`<div />`}
              <div class="text-[10px] font-mono text-blue-400 bg-blue-900/30 px-3 py-1 rounded-full border border-blue-500/20">
                NODE ${hist.length + 1}
              </div>
            </div>
            <h2 class="text-xl md:text-2xl font-bold text-white mb-7 leading-relaxed">
              ${QUIZ[node].q}
            </h2>
            <div class="space-y-3">
              ${QUIZ[node].opts.map((opt, idx) => {
                const isSel   = selIdx === idx;
                const isOther = selIdx !== null && selIdx !== idx;
                return html`
                  <button key=${idx} onClick=${() => handleOpt(opt, idx)} disabled=${selIdx!==null}
                    class=${'w-full text-left p-4 md:p-5 rounded-2xl border transition-all duration-300 flex items-center justify-between group relative overflow-hidden backdrop-blur-sm ' +
                      (isSel   ? 'os bg-blue-600/90 border-blue-400 scale-[.98] shadow-[0_0_30px_rgba(59,130,246,.6)]' :
                       isOther ? 'opacity-30 scale-[.95]' :
                                 'bg-slate-800/60 border-slate-700 hover:bg-slate-700/80 hover:border-blue-500/50 hover:shadow-lg')}>
                    <div class="ripple-bg" />
                    <span class=${'relative z-10 text-base font-medium transition-colors pr-4 ' +
                      (isSel ? 'text-white font-bold' : 'text-slate-300 group-hover:text-white')}>
                      ${opt.t}
                    </span>
                    <div class=${'relative z-10 w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 transition-colors ' +
                      (isSel ? 'border-white' : 'border-slate-600 group-hover:border-blue-400')}>
                      <div class=${'w-2 h-2 rounded-full transition-all ' +
                        (isSel ? 'bg-white scale-100' : 'bg-blue-400 scale-0 group-hover:scale-50')} />
                    </div>
                  </button>`;
              })}
            </div>
          </div>
        </${Card}>`}
 
      <!-- ════════════════ ANALYZING ════════════════ -->
      ${step === 'analyzing' && html`
        <${Card}>
          <div class="p-8 min-h-[400px] flex flex-col items-center justify-center text-center font-mono">
            <div class="relative mb-8">
              <div class="absolute inset-0 bg-blue-500 blur-xl opacity-20 rounded-full animate-pulse"></div>
              <${Ic} n="Spin" c="w-16 h-16 text-blue-400 animate-spin" />
            </div>
            ${lines.map((l, i) => html`
              <div key=${i} class="text-blue-300 fu text-sm md:text-base mb-3">
                <span class="text-blue-500 mr-2">▶</span>${l}
              </div>`)}
          </div>
        </${Card}>`}
 
      <!-- ════════════════ REPAIR RESULT ════════════════ -->
      ${step === 'repair_done' && rep && html`
        <${Card} border="border-orange-500/20">
          <${Header} icon="Wrench" label="ARCHI PC 維修診斷" accent="text-orange-400" />
          <div class="p-6 md:p-8">
            <div class="text-center mb-5">
              <div class="text-5xl mb-3">${rep.icon}</div>
              <h2 class="text-2xl font-extrabold text-orange-400 mb-1">${rep.title}</h2>
              <p class="text-slate-400 text-sm">初步診斷結果</p>
            </div>
            <div class="bg-slate-800/50 rounded-xl p-4 mb-4 text-slate-300 text-sm leading-relaxed">${rep.desc}</div>
            <div class="bg-orange-500/10 border border-orange-500/30 rounded-xl p-3 mb-5 text-orange-300 text-sm font-medium text-center">🔧 ${rep.tip}</div>
            <${CTABox} />
            <button onClick=${handleBack}
              class="w-full flex items-center justify-center gap-2 py-3 text-slate-400 hover:text-white border border-slate-700 rounded-xl transition-all text-sm">
              <${Ic} n="ArrowL" c="w-4 h-4" /> 重新選擇問題
            </button>
          </div>
        </${Card}>`}
 
      <!-- ════════════════ MAIN RESULT ════════════════ -->
      ${step === 'result' && res && html`
        <${Card}>
          <${Header} icon="Monitor" label="ARCHI PC Core — 診斷完成" />
          <div class="p-6 md:p-8">
 
            <!-- ★ M-07: urgency banner -->
            ${ugBanner && html`
              <div class=${'mb-4 px-4 py-3 rounded-xl border text-sm font-medium ' + ugBanner.cls}>
                ${ugBanner.txt}
              </div>`}
 
            <!-- Type badge + title -->
            <div class="text-center mb-3">
              <div class=${'inline-block px-4 py-1.5 rounded-full border text-sm font-bold mb-3 ' + res.bb}>
                ${res.code}
              </div>
              <h2 class=${'text-2xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r ' + res.tc}>
                ${res.title}
              </h2>
              <p class="text-slate-300 font-medium mt-2 text-sm">"${res.sub}"</p>
            </div>
 
            <${Img} url=${res.img} alt=${res.title} />
 
            <!-- ★ M-05 Fix: "天生不對盤" replaced by "升級方向" (positive framing) -->
            <div class="grid grid-cols-2 gap-3 mb-4">
              <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 flex flex-col items-center text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-0.5 bg-gradient-to-r from-pink-600 to-rose-400"></div>
                <${Ic} n="Heart" c="w-5 h-5 text-pink-500 mb-1.5" />
                <span class="text-[10px] text-slate-400 font-bold mb-1 tracking-wider">🏆 最佳合夥人</span>
                <span class="text-sm font-extrabold text-slate-100">${res.mate}</span>
              </div>
              <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 flex flex-col items-center text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-0.5 bg-gradient-to-r from-blue-600 to-cyan-400"></div>
                <${Ic} n="TrendUp" c="w-5 h-5 text-blue-400 mb-1.5" />
                <span class="text-[10px] text-slate-400 font-bold mb-1 tracking-wider">🚀 你的升級方向</span>
                <span class="text-sm font-extrabold text-slate-100">${res.upgrade}</span>
              </div>
            </div>
 
            <!-- Description -->
            <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-4 mb-4 text-slate-300 text-sm leading-relaxed text-center">
              ${res.desc}
            </div>
 
            <!-- ★ M-04 Fix: budget hint based on user's actual budget choice -->
            ${bg && res.bh && res.bh[bg] && html`
              <div class="bg-blue-500/10 border border-blue-500/30 rounded-xl p-3 mb-4 text-blue-300 text-sm text-center">
                <span class="font-bold">💡 你的預算建議：</span>${res.bh[bg]}
              </div>`}
 
            <!-- ★ S-07 Fix: differentiation from competitors -->
            <div class="bg-slate-800/40 border border-slate-600/40 rounded-xl p-4 mb-5 text-xs text-slate-400 leading-relaxed">
              <p class="font-bold text-slate-300 mb-2 text-sm">🔬 為什麼選 ARCHI PC？</p>
              <p class="mb-1">• ${res.diff}</p>
              <p class="mb-1">• 在地師傅面對面溝通需求，不是網路填單等回音</p>
              <p>• 組裝後一年免費到府維修，買了不用擔心</p>
            </div>
 
            <${CTABox} />
 
            <!-- ★ M-06 Fix: share incentive text added -->
            <button onClick=${handleShare}
              class="w-full flex items-center justify-center gap-2 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition-colors border border-slate-700 text-sm font-medium">
              <${Ic} n="Share" c="w-5 h-5" />
              ${shareMsg || '🎁 複製連結分享給朋友（推薦好友享優惠）'}
            </button>
          </div>
        </${Card}>`}
 
      <!-- ════════════════ MODAL  ════════════════
           ★ M-10 Fix: no forced countdown — user clicks when ready
           ★ T-08 Fix: window.open instead of window.location.href
      ════════════════════════════════════════ -->
      ${modal && html`
        <div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm"
          onClick=${e => { if (e.target === e.currentTarget) setModal(null); }}>
          <div class="bg-slate-800 border border-blue-500/30 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl fu">
            <div class="flex justify-end mb-2">
              <button onClick=${() => setModal(null)} class="text-slate-400 hover:text-white bg-slate-700/50 p-2 rounded-full">
                <${Ic} n="X" c="w-4 h-4" />
              </button>
            </div>
            <h3 class="text-xl font-bold text-white mb-3">即將前往客服</h3>
            <div class="space-y-2 mb-6 text-sm text-slate-300 text-left bg-slate-900/50 rounded-xl p-4">
              <p>${modal.copied ? '✅ 已自動複製「通關取件碼」到剪貼簿！' : '⚠️ 複製失敗，請手動記下診斷代碼再聯繫。'}</p>
              <p>📋 進入聊天室後，請直接「貼上」文字並傳送。</p>
              ${modal.platform === 'line' && !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && html`
                <p class="text-yellow-300 text-xs mt-1">💻 電腦版提示：若出現 QR Code，請用手機掃描，或允許「開啟 LINE 應用程式」</p>`}
            </div>
            <div class="flex gap-3">
              <button onClick=${() => setModal(null)}
                class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-medium transition-all text-sm">
                取消
              </button>
              <button onClick=${doRedirect}
                class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold transition-all shadow-lg">
                前往 ${modal.platform === 'line' ? 'LINE' : 'IG'} →
              </button>
            </div>
          </div>
        </div>`}
 
      <!-- Restart floating button -->
      ${(step === 'result' || step === 'repair_done') && html`
        <button onClick=${startQuiz}
          class="fixed bottom-6 right-6 bg-slate-800/90 backdrop-blur-md border border-slate-600 text-white px-5 py-3 rounded-full flex items-center hover:bg-slate-700 hover:scale-105 active:scale-95 transition-all z-50 font-bold shadow-xl">
          <${Ic} n="Refresh" c="w-4 h-4 mr-2" /> 重新測驗
        </button>`}
    </div>`;
}
 
render(h(App, null), document.getElementById('root'));
</script>
</body>
</html>
