<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARCHI PC 核心診斷</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 React 與 Babel (讓瀏覽器直接看懂元件) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 載入 html2canvas (用於網頁自動擷圖) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-[#0a0f1c] text-slate-200 m-0 p-0 overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    // ⚠️ 注意：這裡不能用 import，必須用這種寫法讓瀏覽器讀取 React
    const { useState, useEffect } = React;

    // --- 內建圖示系統 ---
    const Icon = ({ name, className, size = 24 }) => {
      const icons = {
        ChevronRight: <path d="m9 18 6-6-6-6"/>,
        Monitor: <><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>,
        RefreshCw: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>,
        ArrowLeft: <><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></>,
        Share2: <><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></>,
        MessageCircle: <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>,
        Gift: <><polyline points="20 12 20 22 4 22 4 12"/><rect width="20" height="5" x="2" y="7"/><line x1="12" x2="12" y1="22" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></>,
        Sparkles: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>,
        X: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
        Heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>,
        ZapOff: <><path d="M12.41 6.75 13 2l-2.43 2.92"/><path d="m18.57 12.91-2.18 2.62L15 22l1.64-1.96"/><path d="m11 11.88-2.6 3.12L6 11h4l-2.5-3"/><path d="m2 2 20 20"/></>,
        Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
        Crosshair: <><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></>,
        Instagram: <><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name]}
        </svg>
      );
    };

    // --- 動態決策樹題庫 ---
    const quizFlow = {
      q_start: {
        title: "平常打開電腦，你最常拿來做什麼？",
        options: [
          { text: "💼 工作賺錢、處理正事", next: 'q_work', effects: { s: 2 } },
          { text: "🎮 玩遊戲、享受虛擬世界", next: 'q_game', effects: { p: 2 } },
          { text: "🍿 看看影片、上網耍廢", next: 'q_quality', effects: { a: 2 } }
        ]
      },
      q_work: {
        title: "工作的時候，你最常處理哪類事情？",
        options: [
          { text: "📁 剪影片、跑程式、處理超大檔案", next: 'q_work_leisure', effects: { p: 3, s: 3 } },
          { text: "📝 打報告、看報表、回信件", next: 'q_work_leisure', effects: { a: 1 } }
        ]
      },
      q_work_leisure: {
        title: "除了工作，你會用這台電腦看 Netflix 或動畫嗎？",
        options: [
          { text: "🎬 當然會，畫質還要好！", next: 'q_quality', effects: { a: 1, p: 1 } },
          { text: "🚫 不會，這台純粹工作用", next: 'q_budget', effects: { s: 1 } }
        ]
      },
      q_game: {
        title: "說到玩遊戲，你通常最追求什麼樣的體驗？",
        options: [
          { text: "⚔️ 享受刀劍交鋒與極限反應，打王閃避的流暢度是我最大的追求", next: 'q_quality', effects: { p: 4 } },
          { text: "🔫 追求分秒必爭的射擊對戰，畫面不用最頂，但幀數絕對不能掉！", next: 'q_quality', effects: { p: 3, s: 1 } },
          { text: "🌍 沉浸在龐大世界與史詩劇情中慢慢探索，光追特效當然要開滿", next: 'q_quality', effects: { p: 5, a: 2 }, pain: "畫質不佳與顯卡瓶頸" },
          { text: "♟️ 熱愛運籌帷幄與發展文明，就算後期運算量極大、拖慢速度也要玩", next: 'q_quality', effects: { p: 2, s: 4 }, pain: "後期運算卡頓與回合延遲" },
          { text: "🏗️ 沉迷於建設城市或模擬人生，喜歡裝滿各種模組來打造專屬世界", next: 'q_quality', effects: { s: 3, a: 2 }, pain: "模組過載與記憶體不足" },
          { text: "🏎️ 享受引擎轟鳴與賽場熱血，追求絲滑無延遲的極速競速體驗", next: 'q_quality', effects: { p: 2, a: 2 } },
          { text: "📖 把遊戲當互動電影體驗，最在乎劇情氛圍與音樂，操作簡單就好", next: 'q_quality', effects: { a: 3 } }
        ]
      },
      q_quality: {
        title: "對於遊戲或影片的「畫面」，你的要求是？",
        options: [
          { text: "✨ 必須全開！追求 4K 與極致細節", next: 'q_budget', effects: { p: 4, a: 2 } },
          { text: "⚡ 順暢不卡頓最重要，畫質中等就好", next: 'q_budget', effects: { s: 1, p: 1 } },
          { text: "能順順看影片、外觀漂亮就好，我不追求極限畫面", next: 'q_budget', effects: { a: 3 } }
        ]
      },
      q_budget: {
        title: "如果準備換新電腦，你最看重哪一點？",
        options: [
          { text: "💎 外觀最重要！想組一台超美的海景房", next: 'analyzing', effects: { a: 5 } },
          { text: "⚖️ CP值最高！錢要花在刀口上", next: 'analyzing', effects: { p: 2, s: 2 } },
          { text: "🚀 效能全滿！預算不是問題，我要最強的", next: 'analyzing', effects: { p: 5 } },
          { text: "🛡️ 絕對穩定！工作不能中斷，當機讓我崩潰", next: 'analyzing', effects: { s: 6 }, pain: "無預警死機與工作中斷" }
        ]
      }
    };

    // --- 本地圖片元件 ---
    const LocalImageAvatar = ({ imageUrl, altText }) => {
      return (
        <div className="relative w-full max-w-[280px] aspect-square mx-auto my-6 flex items-center justify-center bg-slate-800/30 rounded-3xl overflow-hidden border border-slate-700/50 shadow-inner">
          <div className="absolute inset-0 rounded-full bg-white/5 blur-3xl"></div>
          <img 
            src={imageUrl} 
            alt={altText} 
            className="relative z-10 w-full h-full object-contain drop-shadow-2xl transform hover:scale-105 transition-transform duration-500"
            onError={(e) => {
              e.target.onerror = null; 
              e.target.src = "https://placehold.co/280x280/1e293b/94a3b8?text=Image\\nNot+Found";
            }}
          />
        </div>
      );
    };

    const ParticlesBackground = () => (
      <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
        {[...Array(20)].map((_, i) => (
          <div 
            key={i} 
            className="absolute rounded-full bg-blue-500/20 animate-pulse"
            style={{
              width: Math.random() * 6 + 2 + 'px', height: Math.random() * 6 + 2 + 'px',
              top: Math.random() * 100 + '%', left: Math.random() * 100 + '%',
              animationDuration: Math.random() * 3 + 2 + 's', animationDelay: Math.random() * 2 + 's'
            }}
          />
        ))}
      </div>
    );

    const HUDBar = ({ label, value, max, colorClass }) => {
      const percentage = Math.min(100, (value / max) * 100);
      return (
        <div className="flex items-center gap-2 mb-1.5">
          <span className="text-[10px] font-mono text-slate-400 w-8">{label}</span>
          <div className="w-24 h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div className={`h-full ${colorClass} transition-all duration-700 ease-out`} style={{ width: `${percentage}%` }} />
          </div>
        </div>
      );
    };

    function App() {
      const [step, setStep] = useState('intro');
      const [currentNode, setCurrentNode] = useState('q_start');
      const [scores, setScores] = useState({ p: 0, s: 0, a: 0 });
      const [history, setHistory] = useState([]);
      const [userPainPoint, setUserPainPoint] = useState(""); 
      const [terminalLines, setTerminalLines] = useState([]);
      const [showCopied, setShowCopied] = useState(false);
      const [isGeneratingImage, setIsGeneratingImage] = useState(false);
      const [modalContent, setModalContent] = useState(null);

      const handleRedirect = async (platform, title, keyword) => {
        // 👇 ⚠️ 聯絡網址設定區 ⚠️ 👇
        // LINE 官方預設機制：電腦版網頁「無法直接聊天」，必定會顯示 QR Code 或提示開啟電腦版 LINE 軟體。
        const LINE_LINK = "https://line.me/R/ti/p/@127ikpql"; 
        const IG_LINK = "https://ig.me/m/archi.pc_official"; 
        // 👆 ======================= 👆

        setIsGeneratingImage(true); 

        const ticketId = Math.floor(1000 + Math.random() * 9000);
        const shortPain = userPainPoint ? userPainPoint.substring(0,2) : "無";
        const sysCode = `${title.substring(0,4)}-P${scores.p}S${scores.s}A${scores.a}-${shortPain}`;
        
        const textToCopy = `你好，我測出來是${title}！\n想領取專屬配置單與建議。\n\n通關密語：【${keyword}】\n診斷代碼：[${sysCode}]\n取件碼：#${ticketId}`;
        
        try {
          const textArea = document.createElement("textarea");
          textArea.value = textToCopy;
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          
          const captureArea = document.getElementById('result-capture-area');
          const canvas = await window.html2canvas(captureArea, { 
            useCORS: true, 
            scale: 2, 
            backgroundColor: '#0a0f1c' 
          });
          
          const link = document.createElement('a');
          link.download = `ARCHI_PC_專屬診斷_${title.substring(0,4)}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click(); 
          
          setIsGeneratingImage(false);

          const platformName = platform === 'line' ? 'LINE 官方帳號' : 'Instagram 私訊';
          
          // 新增針對電腦版使用者的友善提示
          const desktopHint = platform === 'line' && !(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) 
            ? "\n\n⚠️ 【電腦版 LINE 提示】\n跳轉後若顯示 QR Code，請使用手機掃描，或點擊允許「開啟 LINE 應用程式」來發送訊息！" 
            : "";

          setModalContent(`✅ 已自動為您複製「通關取件碼」\n⬇️ 並已將「結果圖卡」下載至相簿/電腦中！\n\n即將跳轉至 ${platformName}...\n進入聊天室後，請「貼上」文字並「傳送」圖卡！${desktopHint}`);
          
          setTimeout(() => {
            setModalContent(null);
            if (platform === 'line') window.location.href = LINE_LINK;
            else window.location.href = IG_LINK; 
          }, 4500); 

        } catch (err) {
          console.error("處理失敗", err);
          setIsGeneratingImage(false);
          if (platform === 'line') window.location.href = LINE_LINK;
          else window.location.href = IG_LINK;
        }
      };

      const handleShare = async (text) => {
        setIsGeneratingImage(true);
        try {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);

          const captureArea = document.getElementById('result-capture-area');
          const canvas = await window.html2canvas(captureArea, { 
            useCORS: true, 
            scale: 2, 
            backgroundColor: '#0a0f1c' 
          });
          
          canvas.toBlob(async (blob) => {
            try {
              const item = new ClipboardItem({ 'image/png': blob });
              await navigator.clipboard.write([item]);
              setShowCopied("✅ 已複製圖片與文字！");
            } catch (clipboardErr) {
              console.warn("剪貼簿 API 不支援圖片寫入，改為自動下載:", clipboardErr);
              const link = document.createElement('a');
              link.download = 'ARCHI_PC_專屬診斷結果.png';
              link.href = canvas.toDataURL('image/png');
              link.click();
              setShowCopied("✅ 已複製文字並下載圖片！");
            }
            setIsGeneratingImage(false);
            setTimeout(() => setShowCopied(false), 3000);
          }, 'image/png');

        } catch (err) {
          console.error('擷圖失敗', err);
          setIsGeneratingImage(false);
          setShowCopied("❌ 擷圖失敗，僅複製文字");
          setTimeout(() => setShowCopied(false), 3000);
        }
      };

      useEffect(() => {
        let isMounted = true;
        if (step === 'analyzing') {
          const lines = [
            "啟動深層需求解析...",
            "分析運算效能依賴係數...",
            "計算散熱與穩定極限...",
            "匹配 12 型科技人格數據庫...",
            "載入本地影像資料庫...",
            "生成專屬報告與配置方案..."
          ];
          let delay = 0;
          lines.forEach((line, index) => {
            setTimeout(() => {
              if (!isMounted) return;
              setTerminalLines(prev => [...prev, line]);
              if (index === lines.length - 1) {
                setTimeout(() => { if (isMounted) setStep('result') }, 1500);
              }
            }, delay);
            delay += 800;
          });
        }
        return () => { isMounted = false; };
      }, [step]);

      const handleStart = () => {
        setStep('quiz');
        setCurrentNode('q_start');
        setScores({ p: 0, s: 0, a: 0 });
        setUserPainPoint("");
        setHistory([]);
        setTerminalLines([]);
      };

      const handleAnswer = (option) => {
        setHistory([...history, { node: currentNode, prevScores: { ...scores }, prevPain: userPainPoint }]);
        const newScores = { ...scores };
        if (option.effects.p) newScores.p += option.effects.p;
        if (option.effects.s) newScores.s += option.effects.s;
        if (option.effects.a) newScores.a += option.effects.a;
        setScores(newScores);

        if (option.pain) setUserPainPoint(option.pain);

        if (option.next === 'analyzing') {
          setStep('analyzing');
        } else {
          setCurrentNode(option.next);
        }
      };

      const handleBack = () => {
        if (history.length === 0) return;
        const lastState = history[history.length - 1];
        setCurrentNode(lastState.node);
        setScores(lastState.prevScores);
        setUserPainPoint(lastState.prevPain);
        setHistory(history.slice(0, -1));
      };

      // --- 包含 12 種角色設定 ---
      const getResultData = () => {
        const { p, s, a } = scores;

        if (p >= 10 && s >= 5) {
          return {
            typeCode: "X-DEV (全能極客)",
            imageUrl: "images/x-dev.jpg",
            title: "無所不能的【全能開發者】", subtitle: "多螢幕多開是日常，運算極限才是你的起點。",
            titleColor: "from-purple-400 to-fuchsia-500", badgeBg: "bg-purple-500/20 text-purple-400 border-purple-500/30",
            desc: "你的電腦使用習慣超狂！同時打遊戲、剪片又開一堆網頁。普通電腦一定會崩潰，你需要的是一台效能直接拉滿、散熱最強的「怪物級神機」！",
            keyword: "極客專屬", compatibility: { mate: "效能硬核玩家", conflict: "桌面美學大師" }
          };
        } else if (p >= 8 && s >= 8) {
          return {
            typeCode: "D-ELITE (數據菁英)",
            imageUrl: "images/d-elite.jpg",
            title: "洞悉一切的【數據菁英】", subtitle: "複雜的運算與龐大數據，都在你的彈指之間。",
            titleColor: "from-indigo-400 to-cyan-500", badgeBg: "bg-indigo-500/20 text-indigo-400 border-indigo-500/30",
            desc: "你對電腦的邏輯運算能力要求極高。比起華麗的畫面，你更在乎海量資料處理時的絕對穩定與超大記憶體吞吐量。你需要一台真正的運算巨獸！",
            keyword: "高階運算", compatibility: { mate: "企業領袖", conflict: "潮流玩家" }
          };
        } else if (p >= 6 && s >= 5 && a >= 5) {
          return {
            typeCode: "M-MAX (影音巨匠)",
            imageUrl: "images/m-max.jpg",
            title: "締造沉浸的【影音巨匠】", subtitle: "追求最極致的影音體驗，你是視覺與聽覺的統治者。",
            titleColor: "from-rose-400 to-orange-500", badgeBg: "bg-rose-500/20 text-rose-400 border-rose-500/30",
            desc: "不管是高階影音剪輯、3D渲染還是享受頂級的藍光電影，你對「聲光效果」有著無與倫比的堅持。你需要色彩最準的螢幕與最強的影音解碼效能！",
            keyword: "影音旗艦", compatibility: { mate: "桌面美學大師", conflict: "務實精算師" }
          };
        } else if (p >= 6 && s >= 5) {
          return {
            typeCode: "C-PRO (專業創作者)",
            imageUrl: "images/c-pro.jpg",
            title: "靈感無限的【頂級創作者】", subtitle: "算圖不卡頓，靈感不中斷，時間是你的魔法。",
            titleColor: "from-slate-300 to-slate-400", badgeBg: "bg-slate-500/20 text-slate-300 border-slate-500/30",
            desc: "你常常需要剪輯大檔案或做設計。「算圖絕對不能卡」跟「絕對不能當機」是你的底線。你需要一台記憶體夠大、處理器超強的創作神機！",
            keyword: "創作者升級", compatibility: { mate: "企業領袖", conflict: "休閒電玩咖" }
          };
        } else if (s >= 6) {
          return {
            typeCode: "B-PRO (企業領袖)",
            imageUrl: "images/b-pro.jpg",
            title: "時間就是金錢的【企業領袖】", subtitle: "你的電腦當機一小時，可能就是幾萬塊的損失。",
            titleColor: "from-sky-400 to-blue-500", badgeBg: "bg-blue-500/20 text-blue-400 border-blue-500/30",
            desc: "對你來說，時間就是金錢，電腦當機一秒都會讓你抓狂！你不追求花俏的功能，你需要的是一台「絕對穩定、永遠不出包」的可靠工作站。",
            keyword: "企業診斷", compatibility: { mate: "專業創作者", conflict: "務實精算師" }
          };
        } else if (p >= 10 && a >= 5) {
          return {
            typeCode: "S-STAR (魅影實況主)",
            imageUrl: "images/s-star.jpg",
            title: "閃耀全場的【魅影實況主】", subtitle: "遊戲要打得帥，主機也要顏值爆表！",
            titleColor: "from-amber-400 to-yellow-500", badgeBg: "bg-yellow-500/20 text-yellow-400 border-yellow-500/30",
            desc: "你不僅追求遊戲要順，主機更要長得超好看！你喜歡閃亮的燈效和透明的玻璃機殼。你需要一台就算邊開實況邊打遊戲，也絕對不卡的美型神機。",

            keyword: "質感桌搭", compatibility: { mate: "魅影實況主", conflict: "務實精算師" }
          };
        } else if (a >= 6) {
          return {
            typeCode: "V-MAX (桌面美學大師)",

            titleColor: "from-emerald-400 to-teal-500", badgeBg: "bg-emerald-500/20 text-emerald-400 border-emerald-500/30",
            desc: "你認為電腦不只要好用，更要是桌上的藝術品！你不需要買用不到的過剩效能，把預算拿來挑一個超美的機殼、把線理得乾乾淨淨，才是你的作風。",
            keyword: "海景房配置", compatibility: { mate: "魅影實況主", conflict: "全能極客" }
          };
        } else if (p >= 4 && p < 8) {
          return {
            typeCode: "G-CAS (休閒電玩咖)",
            imageUrl: "images/g-cas.jpg",

            desc: "你玩遊戲是為了開心跟朋友同樂！不用花大錢追求什麼頂級畫質，只要能順順打幾場 LOL 或特戰英豪不卡頓，這台電腦對你來說就滿分了！",
            keyword: "主流電競主機", compatibility: { mate: "務實精算師", conflict: "專業創作者" }
          };
        } else if (s <= 4 && p <= 3 && a < 5) {
          return {
            typeCode: "W-LITE (數位游牧者)",
            imageUrl: "images/w-lite.jpg",
            title: "輕巧自在的【數位游牧者】", subtitle: "簡約、安靜、順暢，生活與工作的完美平衡。",

            keyword: "極簡文書主機", compatibility: { mate: "務實精算師", conflict: "效能硬核玩家" }

        } else {
          return {

            imageUrl: "images/e-opt.jpg",

            titleColor: "from-blue-300 to-sky-400", badgeBg: "bg-blue-500/20 text-blue-400 border-blue-500/30",
            desc: "你買東西超級理性，絕對不花冤枉錢！你不追求最貴的規格，也不要浮誇的外表，你只想找到「效能剛好夠用、價格最划算」的完美平衡點。",
            keyword: "高CP值配置", compatibility: { mate: "數位游牧者", conflict: "企業領袖" }

            <div className="bg-[#0f172a]/80 p-4 flex items-center justify-between border-b border-slate-800">
              <div className="flex items-center space-x-2">
                <Icon name="Monitor" className="text-blue-500 w-5 h-5" />
                <span className="font-bold tracking-wider text-sm text-slate-300">ARCHI PC 核心診斷</span>
              </div>

                  </button>
                </div>
              )}

              {step === 'quiz' && (
                <div className="w-full animate-in slide-in-from-right-8 duration-300" key={currentNode}>
                  {history.length > 0 && (
                    <button onClick={handleBack} className="mb-4 flex items-center text-xs text-slate-500 hover:text-white transition-colors">
                      <Icon name="ArrowLeft" className="w-3 h-3 mr-1" /> 回上一題

                    {quizFlow[currentNode].title}

                  <div className="space-y-3">
                    {quizFlow[currentNode].options.map((option, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleAnswer(option)}
                        className="w-full text-left p-4 md:p-5 rounded-2xl border border-slate-700 bg-slate-800/60 hover:bg-slate-700 hover:border-blue-500 transition-all flex items-center justify-between group"
                      >
                        <span className="text-slate-300 group-hover:text-white text-base font-medium">
                          {option.text}
                        </span>
                        <div className="w-6 h-6 rounded-full border-2 border-slate-600 group-hover:border-blue-400 flex items-center justify-center shrink-0 ml-4">
                          <div className="w-2.5 h-2.5 rounded-full bg-blue-400 opacity-0 group-hover:opacity-100 transition-opacity" />
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {step === 'analyzing' && (
                <div className="font-mono text-sm space-y-3 h-full flex flex-col justify-center items-center text-center">
                  <div className="animate-spin text-blue-500 mb-6">
                    <Icon name="Activity" className="w-12 h-12" />
                  </div>
                  {terminalLines.map((line, idx) => (
                    <div key={idx} className="text-blue-400 animate-in fade-in">
                      &gt; {line}
                    </div>
                  ))}
                </div>
              )}

              {step === 'result' && (() => {
                const result = getResultData();
                return (
                  <div className="animate-in fade-in zoom-in-95 duration-500">
                    
                    <div className="text-center mb-2">
                      <div className={`inline-block px-4 py-1.5 rounded-full border text-sm font-bold mb-3 shadow-sm ${result.badgeBg}`}>
                        {result.typeCode}
                      </div>
                      <h2 className={`text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r ${result.titleColor}`}>
                        {result.title}
                      </h2>
                      <p className="text-slate-300 font-medium mt-2 text-sm md:text-base">"{result.subtitle}"</p>
                    </div>

                    {/* --- 本地圖片元件 --- */}
                    <LocalImageAvatar imageUrl={result.imageUrl} altText={result.title} />

                    <div className="grid grid-cols-2 gap-4 mb-6 mt-4">
                      <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 flex flex-col items-center text-center shadow-lg relative overflow-hidden group hover:border-pink-500/50 transition-colors">
                        <div className="absolute top-0 left-0 w-full h-1 bg-pink-500"></div>
                        <div className="group-hover:scale-110 transition-transform text-pink-500 mb-2">
                          <Icon name="Heart" className="w-6 h-6" />
                        </div>
                        <span className="text-xs text-slate-400 font-bold mb-1 tracking-wider">🏆 最佳合夥人</span>
                        <span className="text-base md:text-lg font-extrabold text-slate-100">{result.compatibility.mate}</span>
                      </div>
                      
                      <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 flex flex-col items-center text-center shadow-lg relative overflow-hidden group hover:border-orange-500/50 transition-colors">

                        <div className="group-hover:scale-110 transition-transform text-orange-500 mb-2">
                          <Icon name="ZapOff" className="w-6 h-6" />

                        <span className="text-xs text-slate-400 font-bold mb-1 tracking-wider">🚫 天生不對盤</span>
                        <span className="text-base md:text-lg font-extrabold text-slate-100">{result.compatibility.conflict}</span>
                      </div>
                    </div>

                    <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 mb-6 text-center shadow-inner">
                      <p className="text-slate-300 text-sm md:text-base leading-relaxed">
                        {result.desc}
                      </p>
                    </div>

                    <div className="bg-gradient-to-br from-slate-800 to-slate-900 border border-blue-500/30 rounded-2xl p-5 mb-6 shadow-xl relative overflow-hidden">
                      <div className="absolute top-0 right-0 p-2 opacity-10 text-blue-500">
                        <Icon name="Gift" className="w-24 h-24" />
                      </div>
                      
                      <div className="mb-4">
                        <h3 className="text-blue-400 font-bold flex items-center gap-2 mb-1 text-sm md:text-base">
                          <Icon name="Sparkles" className="w-4 h-4" /> 您已解鎖專屬神機提案
                        </h3>
                        <p className="text-slate-300 text-sm mt-2 relative z-10">

                        </p>
                      </div>
                      
                      <div className="flex flex-col gap-3 relative z-10">
                        <button 
                          onClick={() => handleRedirect('line', result.title, result.keyword)}

                          <Icon name="MessageCircle" className="w-5 h-5" />
                          {isGeneratingImage ? "打包檔案中..." : "透過 LINE 領取配置單"}
                        </button>
                        
                        <button 
                          onClick={() => handleRedirect('ig', result.title, result.keyword)}
                          disabled={isGeneratingImage}
                          className={`w-full flex items-center justify-center gap-2 py-3.5 ${isGeneratingImage ? 'bg-slate-600 cursor-wait' : 'bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 shadow-md'} text-white font-bold rounded-xl transition-all`}
                        >
                          <Icon name="Instagram" className="w-5 h-5" />
                          {isGeneratingImage ? "打包檔案中..." : "透過 IG 私訊領取"}

                      </div>
                    </div>

                    <button 
                      onClick={() => handleShare(`【ARCHI PC 核心診斷】我的專屬科技人格是「${result.typeCode}」！\n${result.subtitle}\n你也來算算最適合你的電腦配置吧！\n👉 測驗連結：https://archipc303-hub.github.io/archipc-quiz`)}

                      data-html2canvas-ignore="true"
                      className={`w-full flex items-center justify-center gap-2 py-3 ${isGeneratingImage ? 'bg-slate-600 cursor-wait' : 'bg-slate-800 hover:bg-slate-700'} text-white rounded-xl transition-colors border border-slate-700 text-sm font-medium`}

                      {isGeneratingImage ? (
                        <><Icon name="Activity" className="w-4 h-4 animate-spin" /> 正在擷取精美畫面...</>
                      ) : (
                        <><Icon name="Share2" className="w-4 h-4" /> {showCopied ? showCopied : "複製結果並分享"}</>
                      )}
                    </button>
                  </div>
                );
              })()}

            </div>
          </div>

          {step === 'result' && (
            <button 
              onClick={handleStart}
              data-html2canvas-ignore="true"
              className="fixed bottom-6 right-6 md:bottom-8 md:right-8 bg-slate-800/90 backdrop-blur-md border border-slate-600 shadow-2xl text-white px-5 py-3 rounded-full flex items-center justify-center hover:bg-slate-700 hover:scale-105 transition-all z-50 font-bold"
            >
              <Icon name="RefreshCw" className="w-4 h-4 mr-2" />

            </button>
          )}

          {modalContent && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in fade-in backdrop-blur-sm" data-html2canvas-ignore="true">
              <div className="bg-slate-800 border border-slate-700 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl animate-in zoom-in-95">
                <div className="flex justify-end mb-2">
                  <button onClick={() => setModalContent(null)} className="text-slate-400 hover:text-white transition-colors bg-slate-700/50 p-2 rounded-full">

                <p className="text-slate-300 text-sm whitespace-pre-line mb-8 leading-relaxed">{modalContent}</p>
                <button 
                  onClick={() => setModalContent(null)} 
                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold transition-all shadow-md"
                >
                  我知道了
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
